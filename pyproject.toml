[project]
name = "emporio-da-musica"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    # Keep build's Windows dependency pinned in the shared Linux-generated file.
    "colorama==0.4.6",
    "pip-tools==7.6.2",
    "ruff==0.17.3",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [".agents", ".codex", ".claude", ".venv-backup*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
